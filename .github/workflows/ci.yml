name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conventions:
    name: conventions (branch names + commit messages)
    runs-on: ubuntu-latest
    permissions:
      # The PR's commit list comes from the pulls API.
      contents: read
      pull-requests: read
    steps:
      # fetch-depth 0 because the action's push-to-main range mode reads history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./conventions
        with:
          branch-exempt-regex: '^dependabot/'

  validate:
    name: validate (shellcheck + self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck + syntax
        run: |
          shellcheck merge-me/scripts/merge-me.sh conventions/scripts/check-conventions.sh
          bash -n merge-me/scripts/merge-me.sh conventions/scripts/check-conventions.sh

      # The script's usage path is deliberately offline-safe (argument parsing
      # happens before any gh call): no arguments must exit 2, never hang or
      # authenticate. This is the contract the composite action relies on.
      - name: Offline usage self-test
        run: |
          set +e
          ./merge-me/scripts/merge-me.sh >/dev/null 2>&1
          rc=$?
          set -e
          [[ "${rc}" -eq 2 ]] || { echo "expected usage exit 2, got ${rc}"; exit 1; }
          echo "usage path exits 2 as documented"
